  <!-- 03 · WebGL 着色器：坐标约定 vUv / gl_FragCoord 的 y 轴向上（0 在屏幕底部）。 -->
  <script id="weather-vertex-source" type="x-shader/x-vertex">
    attribute vec2 aPosition;
    varying vec2 vUv;
    void main() {
      vUv = aPosition * 0.5 + 0.5;
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  </script>
  <script id="weather-fragment-source" type="x-shader/x-fragment">
    // WebGL 1 天空：只画背景，正文在独立 DOM 层。
    // 约定：y 轴向上；"下落" = 屏幕 y 减小；风的水平分量带符号（+ 向右 / − 向左），由 JS 统一给出。
    // 所有随时间累积的位移（云、雨、雪）都由 JS 积分后以 uniform 传入，阵风时速度平滑变化而不跳位。
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    varying vec2 vUv;
    uniform vec2 uResolution;   // 绘图缓冲像素
    uniform float uPxScale;     // 每 CSS 像素对应的缓冲像素
    uniform float uAspect;
    uniform float uTime;        // 仅用于摆动、闪烁等周期细节

    // —— 日照（JS 按瑶海区坐标与时间计算） ——
    uniform vec2 uSunPos;       // 屏幕 uv，可超出 0..1（高太阳在画面上方之外）
    uniform float uSunVis;      // 太阳在地平线以上的可见度
    uniform float uDaylight;    // 0 夜间 … 1 白天
    uniform float uWarmth;      // 低太阳暖色强度
    uniform float uTwilight;    // 民用晨昏蒙影
    uniform vec3 uMoon;         // xy 示意位置，z 可见度（示意，不代表真实月相）

    // —— 云与风 ——
    uniform float uCloudCover;  // 0..1
    uniform float uWindStretch; // 0..1 风大时云沿风向拉长（随风速平滑变化）
    uniform float uScud;        // 0..1 已有云层被强风吹碎的程度（不新增云量）
    uniform vec2 uCloudFar;
    uniform vec2 uCloudNear;
    uniform vec2 uScudShift;
    uniform vec3 uHeroCloud;    // 多云：经过太阳的那团云，xy 为 (x*aspect, y)，z 强度

    // —— 降水 ——
    uniform float uRain;        // 0..3
    uniform float uRainSlope;   // 每下落 1 像素的水平位移（向右为正、向左为负）
    uniform vec3 uRainFall;     // 三层雨丝累计下落量（CSS 像素）
    uniform float uSnow;        // 0..3
    uniform vec3 uSnowFall;     // 三层雪累计下落量（视口高度）
    uniform vec3 uSnowDrift;    // 三层雪累计水平漂移（视口高度）
    uniform float uGlass;       // 玻璃水珠（默认关闭）

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
      p3 += dot(p3, p3.yzx + 19.19);
      return fract((p3.x + p3.y) * p3.z);
    }

    vec2 hash22(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
      p3 += dot(p3, p3.yzx + 19.19);
      return fract(vec2((p3.x + p3.y) * p3.z, (p3.x + p3.z) * p3.y));
    }

    float noise(vec2 p) {
      vec2 cell = floor(p);
      vec2 f = fract(p);
      vec2 s = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
      return mix(
        mix(hash12(cell), hash12(cell + vec2(1.0, 0.0)), s.x),
        mix(hash12(cell + vec2(0.0, 1.0)), hash12(cell + vec2(1.0, 1.0)), s.x),
        s.y
      );
    }

    // 四个固定倍频：第四层给云边增加细碎感，避免整片"糊开"
    float cloudNoise(vec2 p) {
      return 0.52 * noise(p)
           + 0.26 * noise(p * 2.03 + vec2(8.7, 2.4))
           + 0.14 * noise(p * 4.09 + vec2(1.8, 9.3))
           + 0.08 * noise(p * 8.17 + vec2(4.6, 7.2));
    }

    // 降水时天空不应透出太阳；晴/多云保持原云量；风不参与此处计算。
    float clearness() {
      float c = 1.0 - smoothstep(0.55, 0.95, uCloudCover);
      return c * (1.0 - smoothstep(0.0, 0.6, uRain + uSnow));
    }

    // ===== 云层"透视"（风格化近似，不是严格的相机投影） =====
    // 把屏幕坐标映射到一张水平的云底平面：屏幕越低 = 越远，同样大小的云在屏幕上越小、越扁
    // （水平缩小 q 倍、竖直缩小 q² 倍）。k 越小透视越强（低云强、高云弱）。
    // 画面顶部 y = 1 处与屏幕坐标 1:1，太阳所在的顶部天空带里云团尺度与运动速度基本不变。
    vec2 cloudPlane(vec2 uv, float k) {
      float q = 1.0 / (max(uv.y, -0.2) + k);
      float qt = 1.0 / (1.0 + k);
      return vec2((uv.x - 0.5) * uAspect * q / qt + 0.5 * uAspect, 1.0 + (qt - q) / (qt * qt));
    }

    // 多云时经过太阳的那团积云（屏幕坐标，相对云团中心）：几个错位的圆顶子团 + 较平的云底；不含噪声
    float heroBlob(vec2 local) {
      vec2 d1 = (local + vec2(0.10, 0.005)) / vec2(0.12, 0.055);
      vec2 d2 = (local - vec2(0.07, 0.000)) / vec2(0.13, 0.058);
      vec2 d3 = (local - vec2(-0.01, 0.035)) / vec2(0.10, 0.060);
      vec2 d4 = (local - vec2(0.17, -0.015)) / vec2(0.07, 0.040);
      float blob = max(max(exp(-dot(d1, d1)), 0.95 * exp(-dot(d2, d2))),
                       max(0.85 * exp(-dot(d3, d3)), 0.6 * exp(-dot(d4, d4))));
      return blob * smoothstep(-0.075, -0.042, local.y);
    }

    // ===== 云：同一函数既用于绘制，也用于太阳遮挡采样 =====
    // 返回 x 透明度、y 明暗、z 云边（用于逆光亮边）、w 厚度。
    // lighting = false 时只算透明度（太阳遮挡采样用）；透明度与 lighting 无关，两种调用结果一致。
    vec4 cloudSample(vec2 uv, bool lighting) {
      if (uCloudCover < 0.02) return vec4(0.0, 1.0, 0.0, 0.0);
      float rain = clamp(uRain / 3.0, 0.0, 1.0);
      float overcast = smoothstep(0.62, 0.92, uCloudCover);
      // 风拉长只作用于近层，并以画面中心为基准缩放：
      // 远层大尺度云团保持不变，强风不会因为"换了一批大云团"而改变整体明暗
      float sx = 1.0 - 0.5 * uWindStretch;
      // 低云透视更强；雨天云底更低、离人更近 → 透视更强、云团更大
      float kN = mix(1.15, 0.85, rain);
      vec2 nScale = vec2(2.1, 3.4) * mix(1.0, 0.8, rain);
      vec2 pf = cloudPlane(uv, 2.2);
      vec2 pn = cloudPlane(uv, kN);
      pn.x = (pn.x - 0.5 * uAspect) * sx + 0.5 * uAspect;
      vec2 bf = pf * vec2(1.25, 2.3) + uCloudFar;
      vec2 bn = pn * nScale + uCloudNear + vec2(7.1, 0.8);
      // 高层（远）：三个倍频；低层（近）：四个倍频。fl / nl 是最低倍频，后面估计受光时复用
      float fl = noise(bf);
      float farF = (0.52 * fl + 0.26 * noise(bf * 2.03 + vec2(8.7, 2.4)) + 0.14 * noise(bf * 4.09 + vec2(1.8, 9.3))) / 0.92;
      float nl = noise(bn);
      float nearF = 0.52 * nl + 0.26 * noise(bn * 2.03 + vec2(8.7, 2.4))
                  + 0.14 * noise(bn * 4.09 + vec2(1.8, 9.3)) + 0.08 * noise(bn * 8.17 + vec2(4.6, 7.2));
      float field = farF * 0.62 + nearF * 0.38;
      vec2 hp = vec2(uv.x * uAspect, uv.y);
      float hb = 0.0;
      if (uHeroCloud.z > 0.001) {
        // 经过太阳的云团：细节噪声锚定在云团中心，随云团一起移动
        vec2 local = hp - uHeroCloud.xy;
        hb = heroBlob(local);
        if (hb > 0.01) {
          float detail = noise(local * vec2(9.0, 15.0) + 3.7) * 0.6 + noise(local * vec2(21.0, 31.0) + 8.1) * 0.4;
          field += uHeroCloud.z * hb * (0.2 + 0.8 * detail);
        }
      }
      float threshold = mix(0.80, 0.22, uCloudCover);
      // 碎积云边缘：只在云边附近叠一层更高倍频（约近层基频 16 倍）的起伏，把边缘"啃"碎；
      // 均值为 0，不改变云量；云核与阴天云盖几乎不受影响
      float rim = 1.0 - smoothstep(0.0, 0.10, abs(field - threshold));
      if (rim > 0.0) field += rim * (noise(bn * 7.7 + vec2(5.2, 1.3)) - 0.5) * 0.16 * (1.0 - 0.75 * overcast);
      // 少云/多云时云边更清楚，阴天时柔和连成一片
      float soft = mix(0.05, 0.15, overcast);
      float shape = smoothstep(threshold - soft, threshold + soft * 1.6, field);
      float alpha = mix(shape * (0.80 + uCloudCover * 0.18), 0.80 + shape * 0.18, overcast);
      float thick = smoothstep(threshold, threshold + 0.30, field);
      float edge = shape * (1.0 - shape) * 4.0;
      if (!lighting) return vec4(alpha, 1.0, edge, thick);
      // 受光（廉价的 2D 体积光照近似）：沿屏幕上"朝向太阳"的方向偏移一小段，再取一次低倍频密度。
      // 那一侧云更厚 → 本处处在背光面/云底，偏暗；那一侧更薄 → 本处是迎光的云边，偏亮。
      // 太阳在地平线下（夜间）时光从上方来，且明暗对比减弱。
      vec2 toSun = (uSunPos - uv) * vec2(uAspect, 1.0);
      vec2 dir = normalize(mix(vec2(0.0, 1.0), toSun / max(length(toSun), 1e-3), 0.85 * uSunVis) + vec2(0.0, 1e-4));
      vec2 uv2 = uv + dir * vec2(1.0 / uAspect, 1.0) * 0.045;
      vec2 pf2 = cloudPlane(uv2, 2.2);
      vec2 pn2 = cloudPlane(uv2, kN);
      pn2.x = (pn2.x - 0.5 * uAspect) * sx + 0.5 * uAspect;
      float low0 = fl * 0.62 + nl * 0.38;
      float low1 = noise(pf2 * vec2(1.25, 2.3) + uCloudFar) * 0.62 + noise(pn2 * nScale + uCloudNear + vec2(7.1, 0.8)) * 0.38;
      if (uHeroCloud.z > 0.001) {
        low0 += uHeroCloud.z * hb * 0.55;
        low1 += uHeroCloud.z * heroBlob(vec2(uv2.x * uAspect, uv2.y) - uHeroCloud.xy) * 0.55;
      }
      float sunward = (low1 - low0) * mix(0.45, 1.0, uDaylight);
      // 积云：云核（从下方看是云底）偏暗，迎光边亮，背光侧暗
      float light = clamp(0.88 - thick * 0.40 - sunward * 2.8 + (nearF - 0.5) * 0.35 + uv.y * 0.05, 0.0, 1.0);
      // 阴天：连续云盖，靠大尺度起伏 + 同样的受光差分做出层次（"云卷"），雨天整体更暗
      float deck = clamp(0.56 + (farF - 0.5) * 1.7 + (nearF - 0.5) * 0.75 - sunward * 2.0 + uv.y * 0.07, 0.0, 1.0);
      light = mix(light, deck, overcast);
      if (uScud > 0.01) {
        // 强风把已有云层吹碎：只在已有云的地方叠加快速移动的明暗起伏，
        // 起伏均值约为 0（不整体变暗），也不提高透明度，因此不新增云量、不改天空底色
        float s = cloudNoise(pn * vec2(4.4, 8.0) + uScudShift + vec2(3.3, 5.1));
        float low = 1.0 - smoothstep(0.25, 1.0, uv.y);
        float amp = uScud * alpha * (0.55 + 0.45 * low);
        light = clamp(light + (s - 0.5) * 0.5 * amp, 0.0, 1.0);
        edge = max(edge, smoothstep(0.55, 0.76, s) * amp * 0.5);
      }
      return vec4(alpha, light, edge, thick);
    }

    // ===== 天空底色：随太阳高度、云量、降水连续变化 =====
    vec3 skyColor(vec2 uv, float clear) {
      float h = clamp(uv.y, 0.0, 1.0);
      vec3 dayTop = mix(vec3(0.17, 0.44, 0.80), vec3(0.32, 0.45, 0.68), uWarmth);
      vec3 dayBot = mix(vec3(0.62, 0.78, 0.93), vec3(0.95, 0.79, 0.62), uWarmth);
      vec3 top = mix(vec3(0.020, 0.035, 0.075), dayTop, uDaylight);
      vec3 bot = mix(vec3(0.060, 0.090, 0.160), dayBot, uDaylight);
      top = mix(top, vec3(0.10, 0.14, 0.30), uTwilight * 0.65);
      bot = mix(bot, vec3(0.80, 0.50, 0.46), uTwilight * 0.75);
      vec3 sky = mix(bot, top, pow(h, 0.7));
      // 朝霞/晚霞：只在太阳一侧的低空，且需天空足够通透
      float side = exp(-pow((uv.x - uSunPos.x) * uAspect, 2.0) * 0.9);
      float band = 1.0 - smoothstep(0.0, 0.55, h);
      sky += vec3(0.30, 0.13, 0.02) * (uWarmth * uDaylight + uTwilight * 0.6) * side * band * clear;
      // 阴、雨、雪：连续灰色云盖
      float rain = clamp(uRain / 3.0, 0.0, 1.0);
      float snow = clamp(uSnow / 3.0, 0.0, 1.0);
      vec3 greyTop = mix(vec3(0.55, 0.60, 0.67), vec3(0.33, 0.39, 0.47), rain);
      vec3 greyBot = mix(vec3(0.74, 0.77, 0.81), vec3(0.50, 0.55, 0.62), rain);
      greyTop = mix(greyTop, vec3(0.50, 0.56, 0.64), snow);
      greyBot = mix(greyBot, vec3(0.70, 0.74, 0.80), snow);
      vec3 grey = mix(greyBot, greyTop, h);
      grey = mix(vec3(0.050, 0.065, 0.095) + grey * 0.06, grey, uDaylight);
      float overcast = smoothstep(0.55, 0.95, uCloudCover);
      return mix(sky, grey, overcast * 0.88);
    }

    // ===== 太阳：光晕随云遮挡 occl 一起衰减 =====
    vec3 addSun(vec3 sky, vec2 uv, float clear, float occl) {
      float vis = uSunVis * clear;
      if (vis < 0.002) return sky;
      vec2 d = (uv - uSunPos) * vec2(uAspect, 1.0);
      float r2 = dot(d, d);
      vec3 sunCol = mix(vec3(1.0, 0.97, 0.90), vec3(1.0, 0.70, 0.42), uWarmth);
      float through = 1.0 - occl * 0.88;
      // 正午光线集中；低太阳光晕更宽更暖
      float tight = mix(0.0025, 0.0045, uWarmth);
      float wide = mix(0.040, 0.10, uWarmth);
      float glow = exp(-r2 / tight) * 0.30 + exp(-r2 / wide) * mix(0.13, 0.18, uWarmth);
      sky += sunCol * glow * vis * through;
      // 一个克制的光学残影，沿太阳—画面中心轴
      vec2 ghost = (uv - (uSunPos + (vec2(0.5) - uSunPos) * 1.4)) * vec2(uAspect, 1.0);
      sky += sunCol * (1.0 - smoothstep(0.012, 0.030, length(ghost))) * 0.035 * vis * through;
      // 日面始终是最亮处；低太阳略带暖色
      float core = (1.0 - smoothstep(0.016, 0.021, sqrt(r2))) * (1.0 - smoothstep(0.3, 0.8, occl) * 0.97);
      return mix(sky, mix(vec3(1.0, 0.995, 0.97), vec3(1.0, 0.86, 0.66), uWarmth * 0.7), core * vis);
    }

    // ===== 夜间：示意月亮与少量星点 =====
    vec3 addNight(vec3 sky, vec2 uv, float clear) {
      float night = 1.0 - smoothstep(0.05, 0.45, uDaylight);
      float vis = night * clear;
      if (vis < 0.002) return sky;
      vec2 starUv = gl_FragCoord.xy / uPxScale / 26.0;
      vec2 starId = floor(starUv);
      float seed = hash12(starId);
      if (seed > 0.991) {
        float star = 1.0 - smoothstep(0.03, 0.09, length(fract(starUv) - 0.5));
        float twinkle = 0.78 + 0.22 * sin(uTime * 0.6 + seed * 20.0);
        sky += vec3(0.55, 0.60, 0.70) * star * twinkle * vis * smoothstep(0.15, 0.6, uv.y);
      }
      vec2 d = (uv - uMoon.xy) * vec2(uAspect, 1.0);
      float r = length(d);
      float disc = 1.0 - smoothstep(0.0125, 0.0155, r);
      float lit = 1.0 - smoothstep(0.011, 0.016, length(d - vec2(-0.0055, 0.002))) * 0.82;
      float halo = exp(-r * r / 0.004) * 0.09 + exp(-r * r / 0.05) * 0.035;
      sky += vec3(0.72, 0.80, 0.94) * halo * vis * uMoon.z;
      return mix(sky, vec3(0.88, 0.91, 0.95) * (0.30 + 0.70 * lit), disc * vis * uMoon.z);
    }

    vec3 addClouds(vec3 sky, vec2 uv, vec4 c, float clear) {
      if (c.x < 0.003) return sky;
      float overcast = smoothstep(0.62, 0.92, uCloudCover);
      float rain = clamp(uRain / 3.0, 0.0, 1.0);
      vec3 lit = mix(vec3(0.98, 0.985, 0.99), vec3(0.80, 0.83, 0.87), overcast);
      vec3 shadow = mix(vec3(0.66, 0.72, 0.80), vec3(0.55, 0.60, 0.67), overcast);
      lit = mix(lit, vec3(0.58, 0.64, 0.72), rain);
      shadow = mix(shadow, vec3(0.33, 0.39, 0.48), rain);
      // 早霞晚霞：只在云量适中、非阴雨时给云边上色
      vec3 sunCol = mix(vec3(1.0, 0.97, 0.90), vec3(1.0, 0.66, 0.40), uWarmth);
      float glowAmt = (uWarmth * uDaylight + uTwilight * 0.8) * clear;
      lit = mix(lit, lit * sunCol * 1.04, glowAmt * 0.75);
      shadow = mix(shadow, vec3(0.60, 0.47, 0.55), uTwilight * clear * 0.5);
      lit = mix(vec3(0.15, 0.19, 0.26), lit, uDaylight);
      shadow = mix(vec3(0.065, 0.09, 0.135), shadow, uDaylight);
      vec3 col = mix(shadow, lit, c.y);
      // 逆光：挡在太阳前的厚云发灰，薄处透光，云边微亮（克制的银边）
      vec2 d = (uv - uSunPos) * vec2(uAspect, 1.0);
      float r2 = dot(d, d);
      float nearW = exp(-r2 / mix(0.03, 0.08, uWarmth)) * uSunVis * clear;
      float nearT = exp(-r2 / 0.004) * uSunVis * clear;
      col = mix(col, shadow * 0.90, nearW * c.w * 0.55);
      col += sunCol * (c.z * 0.40 * nearW + (1.0 - c.w) * 0.30 * nearT);
      col += vec3(0.20, 0.08, 0.02) * c.z * glowAmt * 0.6;
      // 远近层次：靠近地平线的云更远，更淡、更融进大气色（阴天云盖保持连续，不减淡）
      float haze = (1.0 - smoothstep(0.0, 0.5, uv.y)) * (1.0 - overcast);
      col = mix(col, sky, haze * 0.25);
      return mix(sky, col, clamp(c.x * (1.0 - haze * 0.35), 0.0, 0.97));
    }

    vec3 addAtmosphere(vec3 col, vec2 uv) {
      float fog = 1.0 - smoothstep(0.0, 0.45, uv.y);
      float rain = clamp(uRain / 3.0, 0.0, 1.0);
      vec3 fogDay = mix(vec3(0.86, 0.90, 0.94), vec3(0.66, 0.71, 0.77), uCloudCover);
      fogDay = mix(fogDay, vec3(0.46, 0.52, 0.60), rain);
      fogDay = mix(fogDay, vec3(0.95, 0.80, 0.66), uWarmth * (1.0 - uCloudCover) * 0.5);
      vec3 fogCol = mix(vec3(0.07, 0.10, 0.15), fogDay, uDaylight);
      col = mix(col, fogCol, fog * (0.10 + uCloudCover * 0.10));
      // 暴雨的雨幕雾气
      return mix(col, fogCol, rain * rain * 0.20);
    }

    // 无雨雪遮挡的天空；玻璃水珠的折射也采样它
    vec3 skyScene(vec2 uv, float occl) {
      uv = clamp(uv, 0.0, 1.0);
      float clear = clearness();
      vec3 col = skyColor(uv, clear);
      col = addNight(col, uv, clear);
      col = addSun(col, uv, clear, occl);
      col = addClouds(col, uv, cloudSample(uv, true), clear);
      return addAtmosphere(col, uv);
    }

    // ===== 雨丝：剪切格子让雨丝方向 = 运动方向；拖尾在上（运动后方），头部在下 =====
    // css：CSS 像素坐标（y 向上）；fall：该层累计下落量；格子 id 以 128 为周期，JS 按周期回绕 fall。
    float rainLayer(vec2 css, float fall, vec2 cell, float density, float len, float width, float seed) {
      float fromTop = uResolution.y / uPxScale - css.y;
      vec2 q = vec2(css.x - uRainSlope * fromTop, css.y + fall);
      vec2 id = floor(q / cell);
      vec2 hid = mod(id, 128.0) + seed;
      if (hash12(hid) > density) return 0.0;
      vec2 center = (id + 0.5) * cell + (hash22(hid + 11.3) - 0.5) * cell * vec2(0.62, 0.55);
      vec2 d = q - center;
      float L = len * mix(0.7, 1.3, hash12(hid + 5.7));
      float t = (L * 0.5 - d.y) / L; // 0 = 拖尾末端（上方），1 = 雨滴头部（下方）
      if (t < 0.0 || t > 1.0) return 0.0;
      float along = smoothstep(0.0, 0.8, t) * (1.0 - smoothstep(0.93, 1.0, t));
      float across = abs(d.x) * inversesqrt(1.0 + uRainSlope * uRainSlope);
      float w = width * 0.5;
      return along * (1.0 - smoothstep(w, w + 0.9, across));
    }

    vec3 addRain(vec3 col) {
      if (uRain < 0.03) return col;
      float r = clamp(uRain / 3.0, 0.0, 1.0);
      vec2 css = gl_FragCoord.xy / uPxScale;
      float farRain = rainLayer(css, uRainFall.x, vec2(12.0, 90.0), mix(0.12, 0.62, r), mix(12.0, 22.0, r), 0.9, 0.0);
      float midRain = rainLayer(css, uRainFall.y, vec2(24.0, 150.0), mix(0.10, 0.48, r), mix(20.0, 42.0, r), 1.15, 37.0);
      float nearRain = rainLayer(css, uRainFall.z, vec2(44.0, 240.0), mix(0.07, 0.36, r), mix(32.0, 72.0, r), 1.6, 71.0);
      float a = min(farRain * 0.40 + midRain * 0.52 + nearRain * 0.62, 0.78);
      a *= smoothstep(0.0, 0.10, uRain);
      vec3 rainCol = mix(vec3(0.52, 0.60, 0.70), vec3(0.90, 0.93, 0.97), uDaylight);
      return mix(col, rainCol, a);
    }

    // ===== 雪：三层远近、不同大小与散焦；风使整体漂移，仍以下落为主 =====
    float snowLayer(vec2 p, float fall, float drift, float scale, float density, float size, float soft, float seed) {
      vec2 q = (p + vec2(-drift, fall)) * scale;
      vec2 id = floor(q);
      vec2 hid = mod(id, 128.0) + seed;
      if (hash12(hid) > density) return 0.0;
      vec2 j = hash22(hid + 4.2);
      vec2 local = fract(q) - 0.5 - (j - 0.5) * 0.35;
      local.x += sin(uTime * mix(0.6, 1.3, j.x) + j.y * 6.28) * 0.10;
      float s = size * mix(0.6, 1.3, hash12(hid + 9.1));
      return 1.0 - smoothstep(s * (1.0 - soft), s, length(local));
    }

    vec3 addSnow(vec3 col, vec2 uv) {
      if (uSnow < 0.03) return col;
      float s = clamp(uSnow / 3.0, 0.0, 1.0);
      vec2 p = vec2(uv.x * uAspect, uv.y);
      float farSnow = snowLayer(p, uSnowFall.x, uSnowDrift.x, 46.0, mix(0.12, 0.66, s), 0.10, 0.60, 0.0);
      float midSnow = snowLayer(p, uSnowFall.y, uSnowDrift.y, 24.0, mix(0.06, 0.40, s), 0.12, 0.45, 19.0);
      float nearSnow = snowLayer(p, uSnowFall.z, uSnowDrift.z, 10.0, mix(0.0, 0.20, s), 0.11, 0.85, 41.0);
      float a = clamp(farSnow * 0.55 + midSnow * 0.88 + nearSnow * 0.45, 0.0, 0.95);
      vec3 snowCol = mix(vec3(0.70, 0.77, 0.86), vec3(1.0), uDaylight);
      return mix(col, snowCol, a * smoothstep(0.0, 0.10, uSnow));
    }

    // ===== 玻璃水珠（可选，默认关闭；不再承担雨量表达） =====
    vec3 addGlassDrops(vec3 color, vec2 uv, float occl) {
      if (uGlass < 0.5 || uRain < 0.5) return color;
      float intensity = clamp(uRain / 3.0, 0.0, 1.0);
      float aspect = max(uAspect, 0.1);
      float pixel = 1.0 / max(uResolution.y, 1.0);
      vec2 point = uv * vec2(aspect, 1.0);
      vec3 result = color;
      float count = floor(mix(4.0, 10.0, intensity) + 0.5);
      for (int i = 0; i < 10; i++) {
        if (float(i) >= count) break;
        vec2 seed = vec2(float(i) * 7.31 + 1.7, float(i) * 13.17 + 5.9);
        vec2 base = hash22(seed);
        float sizeRandom = hash12(seed + 7.7);
        float size = mix(0.004, 0.012, sizeRandom);
        float fallSpeed = mix(0.004, 0.06, sizeRandom * sizeRandom);
        // y 减小 = 向下滑；拖尾位于水珠上方（运动后方）
        float y = mod(base.y - uTime * fallSpeed + 0.18, 1.36) - 0.18;
        float x = base.x * aspect + uRainSlope * (base.y - y) * 0.15;
        vec2 delta = point - vec2(x, y);
        float trailLength = size * mix(2.0, 4.5, intensity) * smoothstep(0.35, 0.95, sizeRandom);
        if (abs(delta.x) > size * 1.5 + pixel || delta.y < -size - pixel || delta.y > size + trailLength + pixel) continue;
        float trailY = (delta.y - size * 0.45) / max(trailLength, pixel);
        if (trailLength > pixel && trailY > 0.0 && trailY < 1.0) {
          float trailWidth = size * 0.16 * (1.0 - trailY * 0.65);
          float trailMask = (1.0 - smoothstep(trailWidth * 0.45, trailWidth + pixel, abs(delta.x)))
                          * (1.0 - smoothstep(0.55, 1.0, trailY));
          result = mix(result, skyScene(uv, occl) * 1.025, trailMask * 0.20);
        }
        vec2 cap = delta / size;
        float radius2 = dot(cap, cap);
        if (radius2 < 1.0) {
          float nz = sqrt(max(1.0 - radius2, 0.001));
          vec3 normal = normalize(vec3(cap, nz));
          vec3 lens = refract(vec3(0.0, 0.0, -1.0), normal, 0.75);
          vec3 dropColor = skyScene(uv + lens.xy * size * 2.8 * vec2(1.0 / aspect, 1.0), occl);
          dropColor *= 1.0 - pow(1.0 - nz, 3.0) * 0.19;
          float body = 1.0 - smoothstep(0.85, 1.0, sqrt(radius2));
          result = mix(result, dropColor, body * 0.9);
        }
      }
      return result;
    }

    void main() {
      // 太阳中心处的云量：与绘制云使用同一函数，保证"云真正遮住太阳"
      // 遮挡只影响太阳光晕与残影，离两者足够远的像素（光晕已 < 1/1000）跳过这次采样以省算力
      float occl = 0.0;
      if (uSunVis * clearness() > 0.002 && uCloudCover > 0.02) {
        vec2 ds = (vUv - uSunPos) * vec2(uAspect, 1.0);
        vec2 dg = (vUv - (uSunPos + (vec2(0.5) - uSunPos) * 1.4)) * vec2(uAspect, 1.0);

      // 阵风：几条不可公度正弦叠加后取阈值，形成"平滑加速—回落"的间歇阵风，而非匀速或随机抖动
      function gustShape(t) {

      function settleToTarget() {

        else ticks++;
        if (gate.shouldDraw(now)) {
          // dt 为两次实际绘制之间的真实时间；上限 0.1 秒：卡顿后粒子不会突然飞走
          frame(Math.min((now - lastDraw) / 1000, 0.1));
          lastDraw = now;
          frames++;
        }
        if (now - sampleAt >= 1500) {
          fps = Math.round((frames * 1000) / (now - sampleAt));
          tickRate = Math.round((ticks * 1000) / (now - sampleAt));
          impactRate = Math.round((impactsInWindow * 1000) / (now - sampleAt));
          impactsInWindow = 0;
          frames = ticks = 0;
          sampleAt = now;
          // 低帧率阈值约为目标的 2/3（60→40，30→22）：先连续 3 次（4.5 秒）再降一档画质（含前景粒子上限），
          // 画质降到下限后仍低于 15 FPS 才切静态备用
          if (fps < (small.matches ? 22 : 40)) {
            slowCount++;
            if (slowCount >= 3 && quality > 0.55) {
              quality *= 0.8;
              slowCount = 0;
              resize();
            } else if (slowCount >= 4 && fps < 15) {
              enterFallback("设备较慢，已切换为静态备用画面");
              return;
            }
          } else slowCount = 0;
          updateStats();
        }
        raf = requestAnimationFrame(tick);
      }
      function restart() {
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        // 重新计时：恢复后的首帧 dt 是一个回调间隔，而不是暂停/后台的时长
        lastDraw = sampleAt = ticks = 0;
        if (gate) gate.reset();
        frames = fps = 0;
        if (isStill()) {
          stopRecording(true, "已切换为静态画面，录制提前结束（已保存已录部分）");
          redrawStill();
        } else {
          updateStaticSky();
          draw();
          renderFx(0, true);
          updateStats();
          if (!hidden && !reviewPaused && !pageSuspended) raf = requestAnimationFrame(tick);
        }
      }
      function windDirLabel(dir) {
        return dir > 0 ? "西风（向右吹）" : "东风（向左吹）";
      }
      // 天气胶囊：只显示图标与简短名称；强风时附加"· 💨 强风"
      function weatherPillText() {
        const s = WEATHERS[weatherIndex],
          icon = (sunTarget.daylight ?? 1) < 0.3 && s.key === "clear" ? "🌙" : s.icon;
        return icon + " " + s.label + (windLevel === "strong" ? " · 💨 强风" : "");
      }
      function updateStats() {
        const s = WEATHERS[weatherIndex],
          wind = WINDS[windLevel];
        $("weatherIcon").innerHTML = "";
        $("weatherIcon").append(weatherPillText());
        const tag = document.createElement("small");
        tag.textContent = "演示";
        $("weatherIcon").append(tag);
        const mode = staticMode(),
          still = mode !== "none";
        stats.textContent = [
          s.label + "（演示预设）",
          wind.label +
            " · " +
            windDirLabel(windDir) +
            (still ? " · " + wind.speed + " km/h（静态，不表现阵风）" : " · 实时 " + Math.round(sim.wind || wind.speed) + " km/h（含阵风）"),
          mode === "2d-fallback"
            ? static2dOk
              ? "静态备用（2D） " + skyStatic.width + "×" + skyStatic.height + " · 重绘 " + staticDrawMs.toFixed(1) + " ms"
              : "静态备用（CSS 渐变）"
            : "WebGL " + canvas.width + "×" + canvas.height,
          "前景 " + fx.width + "×" + fx.height,
          mode === "2d-fallback"
            ? "静止（无动画）"
            : mode === "webgl-still"
              ? "静态（WebGL 单帧）"
              : fps + " FPS（目标 " + (small.matches ? 30 : 60) + "）",
          still ? "水花已停（静态）" : "击打 " + impactRate + "/s · 水花 " + splashes.length,
          s.snow ? "积雪示意 " + Math.round(snowAmount * 100) + "%" : "",
          "画质 " + Math.round(quality * 100) + "%",
        ]
          .filter(Boolean)
          .join(" · ");
        $("static").textContent = forceStatic
          ? "减少动态：静态预览"
          : motion.matches
            ? "减少动态：系统已开启"
            : "减少动态：跟随系统";
        $("glass").textContent = "玻璃水珠：" + (glassDrops ? "开" : "关");
      }

      // ================= 9. 审查控件 =================
      // 点击时平滑过渡（simulate 里的指数平滑）；自动化调用再另行 settleToTarget()
      function refreshControls() {
        document
          .querySelectorAll("#scenes button")
          .forEach((x, n) => x.classList.toggle("active", n === weatherIndex));
        document.querySelectorAll("#presets button").forEach((x, n) => {
          const p = PRESETS[n];
          x.classList.toggle("active", WEATHERS[weatherIndex].key === p.weather && windLevel === p.wind);
        });
        document.querySelectorAll("#winds button").forEach((x) => x.classList.toggle("active", x.dataset.key === windLevel));
        document.querySelectorAll("#windDirs button").forEach((x) => x.classList.toggle("active", +x.dataset.dir === windDir));
      }
      function applyWeatherAndWind() {
        refreshControls();
        updateFallbackBackground();
        restart();
      }
      function selectWeather(i) {
        weatherIndex = i;
        applyWeatherAndWind();
      }
      function selectWind(level, dir) {
        if (level !== undefined) windLevel = level;
        if (dir !== undefined) windDir = dir;
        applyWeatherAndWind();
      }
      WEATHERS.forEach((s, i) => {
        const b = document.createElement("button");
        b.textContent = s.icon + " " + s.label;
        b.onclick = () => selectWeather(i);
        $("scenes").append(b);
      });
      PRESETS.forEach((p) => {
        const b = document.createElement("button");
        b.textContent = "💨 " + p.label;
        b.onclick = () => {
          weatherIndex = WEATHERS.findIndex((w) => w.key === p.weather);
          selectWind(p.wind);
        };
        $("presets").append(b);
      });
      for (const [key, w] of Object.entries(WINDS)) {
        const b = document.createElement("button");
        b.textContent = w.label + " " + w.speed + " km/h";
        b.dataset.key = key;
        b.onclick = () => selectWind(key);
        $("winds").append(b);
      }
      for (const dir of [1, -1]) {
        const b = document.createElement("button");
        b.textContent = (dir > 0 ? "→ " : "← ") + windDirLabel(dir);
        b.dataset.dir = dir;
        b.onclick = () => selectWind(undefined, dir);
        $("windDirs").append(b);
      }
      refreshControls();
      TIME_PRESETS.forEach((p) => {
        const b = document.createElement("button");
        b.textContent = p.label;
        b.dataset.key = p.key;
        b.onclick = () => {
          timePreset = p.key;
          timeMode = p.key === "live" ? "live" : "demo";
          if (p.key === "live") demoDate = null;
          updateTimeState(false);
        };
        $("times").append(b);
      });
      $("clock").addEventListener("input", (e) => {
        timeMode = "demo";
        timePreset = "custom";
        demoMinutes = +e.target.value;
        updateTimeState(true);
      });
      $("dateInput").addEventListener("change", (e) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);
        if (!m) return;
        demoDate = { y: +m[1], m: +m[2], d: +m[3] };
        updateTimeState(true);
      });
      $("static").onclick = () => {
        forceStatic = !forceStatic;
        restart();
      };
      $("glass").onclick = () => {
        glassDrops = !glassDrops;
        if (isStill()) redrawStill();
        updateStats();
      };
      $("phone").onclick = () => {
        const u = new URL(location.href);
        u.search = "phone=1";
        window.open(u.href, "_blank");
      };
      $("clean").onclick = () => {
        document.body.classList.add("clean");
        geometryDirty = true;
        if (isStill()) redrawStill();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.body.classList.remove("clean");
          geometryDirty = true;
          if (isStill()) redrawStill();
        }
      });
      function save(blob, name) {
        const a = document.createElement("a"),
          url = URL.createObjectURL(blob);
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 15000);
      }
      function fileStem() {
        return (
          "鸭鸭日历-仅天空背景" +
          (fallback ? "（静态备用）" : "") +
          "-" +
          WEATHERS[weatherIndex].label +
          "-" +
          WINDS[windLevel].label +
          (windDir > 0 ? "西风" : "东风") +
          "-" +
          hhmm($("clock").value).replace(":", "")
        );
      }
      // 只导出天空背景画布：WebGL 动画/单帧时导出 #sky，降级时导出 #skyStatic；都不含正文与前景层
      $("export").onclick = () => {
        let src = canvas,
          label = "天空背景";
        if (fallback) {
          if (!static2dOk) return setMessage("静态备用为 CSS 渐变，没有可导出的天空画布");
          src = skyStatic;
          label = "天空背景（静态备用）";
        } else draw();
        src.toBlob((b) => {
          if (b) {
            save(b, fileStem() + ".png");
            setMessage("已导出" + label + " PNG（不含正文与前景水花/积雪）");
          } else setMessage("无法导出当前画布");
        }, "image/png");
      };
      // 结束录制并立即释放：停止轨道、清定时器、移除 exporting；keep=false 时丢弃数据（出错/离开页面）
      function stopRecording(keep, message) {
        const rec = recording;
        if (!rec) return;
        recording = null;
        rec.keep = keep;
        clearTimeout(rec.timer);
        try {
          if (rec.recorder.state !== "inactive") rec.recorder.stop();
        } catch (e) {
          rec.keep = false;
        }
        rec.media.getTracks().forEach((t) => t.stop());
        document.body.classList.remove("exporting");
        if (message) setMessage(message);
      }
      $("record").onclick = () => {
        if (recording || isStill()) return setMessage(isStill() ? "静态模式不录制动画" : "正在录制");
        if (!canvas.captureStream || !window.MediaRecorder) return setMessage("此浏览器不支持录制");
        const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"].find((x) =>
          MediaRecorder.isTypeSupported(x),
        );
        if (!mime) return setMessage("无可用录制格式");
        const media = canvas.captureStream(small.matches ? 30 : 60);
        let recorder;
        try {
          recorder = new MediaRecorder(media, { mimeType: mime, videoBitsPerSecond: 3500000 });
        } catch (e) {
          media.getTracks().forEach((t) => t.stop());
          return setMessage("录制失败：" + e.message);
        }
        const rec = { recorder, media, timer: 0, keep: true, chunks: [], name: fileStem() };
        recorder.ondataavailable = (e) => {
          if (e.data.size) rec.chunks.push(e.data);
        };
        recorder.onerror = () => stopRecording(false, "录制出错，已停止并释放资源");
        // onstop 只负责保存；资源已在 stopRecording 里释放
        recorder.onstop = () => {
          if (rec.keep && rec.chunks.length)
            save(new Blob(rec.chunks, { type: mime }), rec.name + (mime.includes("mp4") ? ".mp4" : ".webm"));
        };
        recording = rec;
        document.body.classList.add("exporting");
        recorder.start();
        setMessage("正在录制 8 秒天空背景（不含正文）…");
        rec.timer = setTimeout(
          () => stopRecording(true, "8 秒天空背景录像已保存（不含正文与前景水花/积雪）"),
          8000,
        );
      };
      document.querySelector(".cta").onclick = () => setMessage("这是审查样例，不提交真实记录");

      // ================= 10. 生命周期 =================
      motion.addEventListener("change", restart);
      small.addEventListener("change", () => {
        resize();
        restart();
      });
      window.addEventListener("resize", () => {
        // 太阳的屏幕投影取决于视口尺寸，尺寸变化后重算
        updateTimeState(true);
        resize();
        if (isStill()) redrawStill();
      });
      window.addEventListener(
        "scroll",
        () => {
          geometryDirty = true;
          if (isStill()) renderFx(0, false);
        },
        { passive: true },
      );
      const layoutObserver = new ResizeObserver(() => {
        geometryDirty = true;
        if (isStill()) renderFx(0, false);
      });
      function observeLayout() {
        layoutObserver.observe(document.querySelector("main"));
        layoutObserver.observe(document.body);
      }
      observeLayout();
      function startLiveTimer() {
        clearInterval(liveTimer);
        liveTimer = setInterval(() => {
          if (timeMode === "live" && !hidden) updateTimeState(false);
        }, 30000);
      }
      function stopLiveTimer() {
        clearInterval(liveTimer);
        liveTimer = 0;
      }
      document.addEventListener("visibilitychange", () => {
        hidden = document.hidden;
        if (hidden) stopRecording(true, "页面已隐藏，录制提前结束（已保存已录部分）");
        restart();
      });
      canvas.addEventListener("webglcontextlost", (e) => {
        e.preventDefault();
        enterFallback("绘图上下文丢失，已切换为静态备用画面");
      });
      canvas.addEventListener("webglcontextrestored", () => {
        program = null;
        setMessage("");
        initGL();
      });
      // 离开页面：先暂停（rAF、live 定时器、录制）；persisted=true 表示进入往返缓存，可能原样返回，
      // 因此只暂停、不销毁 GL 资源、不断开观察器；否则彻底清理。监听器只在启动时注册这一次。
      window.addEventListener("pagehide", (e) => {
        pageSuspended = true;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        stopLiveTimer();
        stopRecording(false);
        if (e.persisted) return;
        pageTornDown = true;
        layoutObserver.disconnect();
        if (gl && !gl.isContextLost()) {
          gl.deleteBuffer(buffer);
          gl.deleteProgram(program);
        }
        program = buffer = null;
      });
      // 从往返缓存返回：恢复定时器与帧循环；若此前已彻底清理则重新观察布局并重建 GL
      window.addEventListener("pageshow", (e) => {
        if (!e.persisted || !pageSuspended) return;
        pageSuspended = false;
        hidden = document.hidden;
        startLiveTimer();
        updateTimeState(true);
        geometryDirty = true;
        if (pageTornDown) {
          pageTornDown = false;
          observeLayout();
          if (!fallback) return initGL();
        }
        if (!fallback && (!gl || gl.isContextLost() || !program)) return initGL();
        resize();
        restart();
      });

      // ================= 11. 本地演示日历（2026 年 10 月，节假日数据已核对） =================
      const cal = $("calendar");
      for (const w of ["一", "二", "三", "四", "五", "六", "日"]) {
        const d = document.createElement("div");
        d.className = "weekday";
        d.textContent = w;
        cal.append(d);
      }
      for (let n = -2; n <= 32; n++) {
        const d = document.createElement("div");
        d.className = "date";
        d.textContent = n <= 0 ? 30 + n : n > 31 ? n - 31 : n;
        if (n <= 0 || n > 31) d.classList.add("muted");
        if (n >= 1 && n <= 7) {
          d.classList.add("holiday");
          d.insertAdjacentHTML("beforeend", '<span class="mark">休</span>');
        }
        if (n === 10) {
          d.classList.add("work");
          d.insertAdjacentHTML("beforeend", '<span class="mark">班</span>');
        }
        if (n === 8) d.classList.add("today");
        cal.append(d);
      }

      // ================= 12. 审查钩子（仅本地审查/自动化截图使用，不涉及业务数据） =================
      window.duckReview = {
        scenes: WEATHERS.map((s) => s.key),
        weathers: WEATHERS.map((s) => s.key),
        // 以下三个设置接口立即生效（settleToTarget），供自动化截图使用
        setWeather(key) {
          const i = WEATHERS.findIndex((s) => s.key === key);
          if (i < 0) throw Error("未知天气 " + key);
          selectWeather(i);
          settleToTarget();
          draw();
          updateStats();
        },
        setWind(level, dir) {
          if (level !== undefined && !WINDS[level]) throw Error("未知风等级 " + level);
          if (dir !== undefined && dir !== 1 && dir !== -1) throw Error("风向只能是 1 或 -1");
          selectWind(level, dir);
          settleToTarget();
          draw();
          updateStats();
        },
        // 兼容旧接口：只设置天气，不改风（windy → 晴，rainWind → 大雨）
        setScene(key) {
          this.setWeather(LEGACY_SCENES[key] || key);
        },
        setTime(value) {
          if (value === "live") (timeMode = "live"), (timePreset = "live"), (demoDate = null);
          else if (typeof value === "string") (timeMode = "demo"), (timePreset = value);
          else (timeMode = "demo"), (timePreset = "custom"), (demoMinutes = value);
          updateTimeState(true);
        },
        setDate(text) {
          const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
          demoDate = m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
          updateTimeState(true);
        },
        setHeroPhase(phase) {
          sim.hero = phase;
          draw();
        },
        // 把累积位移与时钟归零，便于在相同云场位置下对比不同风况（仅审查用）
        resetMotion() {
          sim.clock = 0;
          sim.hero = 0.15;
          for (const a of [sim.cloudFar, sim.cloudNear, sim.scud, sim.rainFall, sim.snowFall, sim.snowDrift]) a.fill(0);
          draw();
        },
        pause() {
          reviewPaused = true;
          restart();
        },
        resume() {
          reviewPaused = false;
          restart();
        },
        // 以固定步长推进模拟，便于逐帧检查运动方向
        advance(seconds, step = 1 / 60) {
          geometryDirty = true;
          for (let t = 0; t < seconds - 1e-6; t += step) {
            simulate(step);
            renderFx(step, !isStill());
          }
          draw();
          updateStats();
        },
        // 读取背景 canvas 指定区域的灰度（左下角为原点），用于自动检查运动方向
        readGray(x, y, w, h) {
          draw();
          const px = new Uint8Array(w * h * 4);
          gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
          const out = new Float32Array(w * h);
          for (let i = 0; i < w * h; i++) out[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
          return Array.from(out);
        },
        // 仅审查：模拟持续低帧率降级（与 tick 里低帧率触发的是同一个 enterFallback）；false 时恢复 WebGL
        forceFallback(on) {
          if (on) enterFallback("设备较慢，已切换为静态备用画面");
          else exitFallback();
          return staticMode();
        },
        // 性能基准（仅审查）：当前状态下连续 draw + gl.finish n 次，末尾读回 1 像素确保 GPU 完成，返回每帧毫秒
        benchmark(n = 60) {
          if (!gl || fallback) return NaN;
          const px = new Uint8Array(4);
          draw();
          gl.finish();
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          const t0 = performance.now();
          for (let i = 0; i < n; i++) {
            draw();
            gl.finish();
          }
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          return (performance.now() - t0) / n;
        },
        state() {
          return {
            scene: WEATHERS[weatherIndex].key,
            weather: WEATHERS[weatherIndex].key,
            windLevel,
            windDir,
            windSigned: sim.windSigned,
            cloudCover: cur.cloud,
            hero: sim.hero,
            pill: weatherPillText(),
            clock: sim.clock,
            canvas: [canvas.width, canvas.height],
            fx: [fx.width, fx.height],
            fps,
            // 调试：每秒 tick 回调次数（应≈显示器刷新率；若翻倍说明有重复帧循环）与活跃句柄
            tickRate,
            rafActive: !!raf,
            liveTimerActive: !!liveTimer,
            recording: !!recording,
            exporting: document.body.classList.contains("exporting"),
            pageSuspended,
            limits: limits(),
            quality,
            fallback,
            still: isStill(),
            staticMode: staticMode(),
            static2dOk,
            staticDrawMs,
            staticCanvas: [skyStatic.width, skyStatic.height],
            staticVisible: skyStatic.style.display === "block",
            sun: { ...sunTarget, info: undefined },
            info: { ...dayInfo((demoDate || shanghaiNow()).y, (demoDate || shanghaiNow()).m, (demoDate || shanghaiNow()).d) },
            wind: sim.wind,
            slope: sim.slope,
            snowAmount,
            drops: drops.map((d) => ({ si: d.si, rem: d.rem, v: d.v })),
            splashes: splashes.map((p) => {
              const s = surfaces[p.si];
              return { x: s.x + p.lx, y: s.y + p.ly, edge: edgeY(s, s.x + clamp(p.lx, 0, s.w)), vx: p.vx, vy: p.vy, card: [s.x, s.y, s.w] };
            }),
            surfaces: surfaces.map((s) => ({ x: s.x, y: s.y, w: s.w, h: s.h, r: s.r })),
          };
        },
      };

      // ================= 13. 启动 =================
      collectSurfaces();
      updateTimeState(true);
      startLiveTimer();
      initGL();
    }
  </script>
</html>
